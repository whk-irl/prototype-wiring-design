    confidence: generic
    source: https://en.wikipedia.org/wiki/USB_hardware
    note: "4 contacts (9 for USB 3). Plug overmould 16 x 8 mm is the independent reviewer's figure, not verified. Housing = receptacle opening width x height x depth from the Wikipedia USB hardware table (secondary). Plug box = the moulded plug, not the metal shell. Length 18.4 mm = 25 mm moulded body minus the 6.65 mm mating part, read from the Assmann ASS 10363 CA drawing of a USB-C to USB-C cable (A-USB32C2-32C2: aluminium shell 25 x 12.3 x 6.4 mm), used for every USB and HDMI plug here as a typical value. Where no maker drawing was opened the overmould is the metal shell plus 4.1 mm on width and height, the margin an independent reviewer gave for USB-C (12.35 x 6.5 mm vs 8.25 x 2.4 mm); the USB-IF and HDMI specifications themselves were not opened."

