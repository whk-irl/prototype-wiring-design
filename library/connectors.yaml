# Connector families. Format: src/core/connectors.ts (ConnectorSchema). Sources and derivations: docs/CONNECTORS.md.
#
# One entry is a family in all its sizes. A port names the family and its number of ways.
# Boxes are in the port frame: +X is the direction the cable leaves, the housing lies behind the
# origin, the plug in front, width along the contact row. confidence 'datasheet' = every figure
# stated by the maker; 'derived' = maker's drawing plus an allowance or sum stated in the note;
# 'generic' = secondary source or no dimensions found, see the note. Nothing here is from memory.
version: 1
connectors:
  - id: jst-sh
    name: "JST SH 1.0 mm wire-to-board"
    short: "JST SH"
    aliases: ["Qwiic", "STEMMA QT", "SR (IDC socket mates)"]
    pitch_mm: 1
    rows: 1
    ways: { min: 2, max: 20 }
    housing: { length_mm: 4.25, height_mm: 2.9, width: { per_way_mm: 1, plus_mm: 2 } }
    plug: { length_mm: 8, height_mm: 2.8, width: { per_way_mm: 1, plus_mm: 3 } }
    accepts:
      - families: [hookup_wire, jumper, harness]
        termination: per_contact
        awg: { thickest: 28, thinnest: 32 }
        od_max_mm: 0.8
    confidence: derived
    source: https://www.jst-mfg.com/product/pdf/eng/eSH.pdf
    note: "Dimensions from the JST SH catalogue sheet. Housing = the header on the part (top-entry body: depth 4.25 mm along the mating axis, 2.9 mm thick, width 1.0 mm per way + 2.0 mm). Plug = the crimp housing; its length is the housing's 5 mm insertion height plus 3 mm for the crimp barrel and straight wire run, an assumption of this library, not a JST figure. Wire range and insulation OD are the contact's, as stated by JST. Header from the BM..B-SRSS-TB table (width = A + 2), housing SHR..-S-B with protrusions (width B = ways + 3). Insulation OD range 0.4 to 0.8 mm."

