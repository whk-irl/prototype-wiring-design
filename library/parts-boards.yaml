        ways: 8
        pose: { p_mm: [5.71, -24.13, 12.1], q: [0.5, 0.5, 0.5, -0.5] }
        interfaces: [power]
        note: "Female socket, cable leaves upward."
      - id: hdr-analog
        name: "Analog inputs A0-A5 (6-pin socket)"
        connector: pin-socket-2.54
        ways: 6
        pose: { p_mm: [26.03, -24.13, 12.1], q: [0.5, 0.5, 0.5, -0.5] }
        interfaces: [analog, gpio, i2c]
        note: "Female socket, cable leaves upward. A4 and A5 double as SDA and SCL."
      - id: icsp
        name: "ICSP header of the ATmega328P (2 x 3 pins)"
        connector: pin-header-2.54-2row
        ways: 6
        pose: { p_mm: [33.777, 1.27, 12.1], q: [0, -0.7071068, 0, 0.7071068] }
        interfaces: [spi]
        note: "Male pins pointing up; three pins per row run along Y. Header height 8.5 mm assumed; centre from the Eagle file."
      - id: icsp-usb
        name: "ICSP header of the USB chip, ATmega16U2 (2 x 3 pins)"
        connector: pin-header-2.54-2row
        ways: 6
        pose: { p_mm: [-12.832, 19.558, 12.1], q: [0.5, 0.5, 0.5, -0.5] }
        interfaces: [spi]
        note: "Male pins pointing up; three pins per row run along X. Header height 8.5 mm assumed."
