# Dev boards that are built from published dimensions: no 3D model is bundled,
# the app draws each one as a circuit board with a connector housing at every
# port. Source of every figure is named in the part's `source` and in the port
# notes where a position was derived from a board file instead of a dimensioned
# drawing. Generated by tools/out/gen_boards.py from the drawing coordinates.
#
# Conventions used in this file
#   Part frame: origin at the centre of the envelope's footprint on the mounting
#   face (the lowest point of the part), +Z up, X along the long side.
#   body.board.z_mm: clearance under the PCB (solder joints, or fitted pins).
#   Port z: the connector's centre line is half the housing height (from
#   connectors.yaml) above the PCB top; for a header it is the top of the
#   socket or the tip of the pins. Where a drawing gives a connector height
#   (Raspberry Pi), the drawing's figure is used instead.
#   Port rotation: port +X is the way the cable leaves, +Y along the contact
#   row, +Z = X cross Y. Horizontal exits keep +Z = part +Z. Vertical exits:
#   leaving up with the row along part X is [-0.5, -0.5, -0.5, 0.5]; leaving up
#   with the row along part Y is [0, -0.7071068, 0, 0.7071068]; leaving down
#   with the row along X is [0.5, 0.5, -0.5, 0.5] (all multiplied out). The brief's
#   [0.5, 0.5, 0.5, 0.5] sends port +X to part +Y, not up, so it is not used.
version: 1
parts:

